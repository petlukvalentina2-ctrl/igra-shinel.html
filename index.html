<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Шинель. Дело о потерянной человечности</title>
<!--
ИНСТРУКЦИЯ ДЛЯ УЧИТЕЛЯ:
1. Задания: массив STAGES в <script>. Каждые два соседних элемента = один этап (всего 5 этапов по 2 задания).
   Типы: choice, multi, match, order, text (проверка регулярным выражением re).
2. Почта учителя: константа TEACHER_EMAIL (если пусто, ученик вводит адрес сам).
3. Баллы: PTS (за верный ответ), HINT_COST (штраф за подсказку). Цвета: CSS-переменные :root.
4. Ответ после «Проверить» исправить нельзя. Результат ученик отправляет кодом (почта, файл, копирование).
5. Кнопка «Учитель» в шапке: вставьте полученные коды или загрузите файлы, чтобы увидеть таблицу результатов.
   Таблица хранится в браузере учителя (localStorage) и выгружается в CSV.
-->
<style>
:root{--bg:#1d1a16;--paper:#efe3c8;--ink:#2a2118;--gold:#d4a24c;--red:#a8322d;--green:#4d8a4a;--text:#eadfca}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#3a3126,var(--bg)) fixed;background-size:cover;color:var(--text);font-family:Georgia,'Times New Roman',serif;min-height:100vh;line-height:1.5}
header{position:sticky;top:0;background:#14110eee;border-bottom:2px solid var(--gold);padding:8px 14px;z-index:5}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:.95rem}
.bar button{background:#3a3126;color:var(--text);border:1px solid var(--gold);border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit}
.prog{height:8px;background:#444;border-radius:5px;margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#f0d58a);transition:width .5s}
main{max-width:820px;margin:0 auto;padding:16px}
.screen{background:#efe3c8f2;color:var(--ink);border-radius:6px;padding:20px;box-shadow:0 6px 24px #000a;border-left:8px solid var(--red);animation:in .5s}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1,h2{margin:.2em 0;color:#5a1d1a}
.tag{font-size:1.15rem;font-style:italic;color:#5a1d1a;border-left:4px solid var(--gold);padding-left:10px;margin:10px 0}
.stamp{display:inline-block;border:3px solid var(--red);color:var(--red);padding:2px 10px;transform:rotate(-4deg);font-weight:bold;letter-spacing:2px}
.clue,.folder{background:#fff8e1;border:1px dashed #8a6d3b;padding:10px 12px;margin:10px 0}.clue{font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{font-size:.8rem;padding:3px 8px;border-radius:12px;background:#d9ccae;border:1px solid #8a6d3b}.chip.on{background:#d8ecd5;border-color:var(--green)}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border:2px solid #8a6d3b;background:#fbf3de;border-radius:6px;font:inherit;color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){background:#f3e5bd}.opt.sel{border-color:var(--red);background:#f1d4cf}.opt.good{border-color:var(--green);background:#d8ecd5}.opt.bad{border-color:var(--red);background:#f3d2cf}
button.main{background:var(--red);color:#fff;border:0;padding:10px 20px;border-radius:6px;font:inherit;cursor:pointer;margin:8px 6px 0 0}
button.main.alt{background:#6b5a3c}button:disabled{opacity:.5;cursor:default}
select,input[type=text],input[type=email],textarea{width:100%;padding:8px;font:inherit;border:2px solid #8a6d3b;border-radius:6px;background:#fbf3de;color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;margin:6px 0}
.ord{cursor:grab;display:flex;gap:6px;align-items:center;margin:5px 0}.ord span{flex:1;background:#fbf3de;border:2px solid #8a6d3b;padding:8px;border-radius:6px}.ord button{padding:6px 10px;cursor:pointer}
.fb{margin-top:12px;padding:10px 12px;border-radius:6px;display:none}
.fb.ok{display:block;background:#d8ecd5;border-left:6px solid var(--green)}.fb.no{display:block;background:#f3d2cf;border-left:6px solid var(--red)}
.hint{color:#5a1d1a;font-size:.95rem;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
.stats div{background:#fff8e1;border:1px solid #8a6d3b;padding:8px;text-align:center}.stats b{display:block;font-size:1.4rem;color:var(--red)}
.modal{position:fixed;inset:0;background:#000b;z-index:10;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:16px}
.modal.show{display:flex}.modal .screen{max-width:900px;width:100%;margin-top:30px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.85rem}th,td{border:1px solid #8a6d3b;padding:4px 6px;text-align:center}th{background:#d9ccae}
@media(max-width:560px){.row{grid-template-columns:1fr}.screen{padding:14px}}
</style>
</head>
<body>
<header>
  <div class="bar"><span>🔍 <span id="stg">Дело № 1842</span></span><span>⭐ <b id="sc">0</b></span>
  <span><button id="bgB">🖼 Фон</button> <button id="tcB">👩‍🏫 Учитель</button></span></div>
  <div class="prog"><i id="pb"></i></div>
</header>
<main id="app"></main>
<div class="modal" id="md"><div class="screen" id="mdc"></div></div>

<script>
'use strict';
const TEACHER_EMAIL = '';   // адрес учителя (можно оставить пустым)
const PTS = 10, HINT_COST = 1;
const KEY='shinel_quest_v3', TKEY='shinel_teacher_v1', BGKEY='shinel_bg', EKEY='shinel_email';
const EPIS=['Последний крик о помощи','Тайны старого архива','Допрос свидетелей','Дело продолжается','Окончательный вердикт'];
const EVID=['Свидетельство о страданиях героя','Досье на Башмачкина','Показания о равнодушии','Доказательство актуальности проблемы','Кодекс человечности'];

/* ====== ЗАДАНИЯ (2 на каждый этап) ====== */
const STAGES=[
 {t:'choice',clue:'Слова героя, обращённые к обидчикам: «Оставьте меня, зачем вы меня обижаете?»',
  q:'Что передаёт эта фраза?',opts:['Беззащитность и боль человека, которого унижают','Угрозу и желание отомстить','Равнодушие героя к службе'],ans:0,
  why:'Автор показывает боль «маленького человека» и вызывает сочувствие читателя.',hint:'Подумайте, как звучит просьба: она кроткая или грозная?'},
 {t:'text',clue:'Новая шинель стала для Акакия Акакиевича больше чем одеждой: она заменила ему мечту о лучшей жизни, тепле и защите.',
  q:'Каким литературным приёмом является шинель в повести? Ответьте одним словом.',re:/символ/i,
  why:'Шинель — символ надежды, тепла и смысла жизни героя.',hint:'Слово начинается на «сим…»: предмет с глубоким смыслом.'},
 {t:'match',clue:'Гоголь не называет виновных прямо. Отношение автора скрыто в художественных приёмах.',
  q:'Соедините приём с примером из повести.',
  pairs:[['Ирония','«вечный титулярный советник» — о герое, застрявшем в низшем чине'],
   ['Звукопись','имя «Акакий Акакиевич»: повтор звуков «ак-ак» звучит нелепо и жалко'],
   ['Цветопись','серые, тусклые, холодные тона Петербурга'],
   ['Символ','шинель как мечта и защита героя'],
   ['Перифраза','«значительное лицо» вместо имени генерала']],
  why:'Ирония сначала смешит, потом рождает жалость; цветопись создаёт ощущение холода и безрадостности.',hint:'Перифраза заменяет прямое название описанием.'},
 {t:'match',clue:'Фигуры синтаксиса и композиционные приёмы усиливают эмоции читателя.',
  q:'Соедините приём с его описанием.',
  pairs:[['Антитеза','«маленький человек» Башмачкин и «значительное лицо»'],
   ['Градация','насмешки, толчки, бумажки на голову: унижение нарастает'],
   ['Анафора','одинаковое начало фраз («Он молчал… Он молчал…» — учебный пример)'],
   ['Психологический параллелизм','холод и мрак города отражают холод людских отношений'],
   ['Автобиографизм','Гоголь сам служил мелким чиновником в Петербурге']],
  why:'Эти приёмы помогают автору выразить сочувствие герою и осудить равнодушие.',hint:'Анафора — единоначатие; градация — усиление.'},
 {t:'choice',clue:'Чиновники годами сыпали на Акакия бумажки. Но один из них услышал: «Оставьте меня…», и ему послышалось: «Я брат твой».',
  q:'Как автор выражает отношение к герою в этой сцене?',opts:['Осуждает героя за слабость','Через мотив братства призывает к состраданию и совести','Смеётся вместе с чиновниками'],ans:1,
  why:'«Я брат твой» — центр гуманизма повести. Единство и солидарность начинаются с отказа унижать другого.',hint:'Что значит слово «брат»?'},
 {t:'multi',clue:'Сослуживцы унижали, значительное лицо отказалось выслушать, окружающие заметили беду слишком поздно.',
  q:'Кто несёт нравственную ответственность за трагедию? (Верных ответов три.)',
  opts:['Сослуживцы, годами унижавшие Акакия','Значительное лицо, отказавшееся выслушать','Окружающие, заметившие страдания слишком поздно','Только грабители, укравшие шинель','Сам Акакий, потому что «не умел защищаться»'],ans:[0,1,2],
  why:'Грабители — лишь исполнители. Нравственная вина — на равнодушном обществе. Справедливость и ответственность обязательны для каждого.',hint:'Жертва не виновата в том, что её обижают.'},
 {t:'match',clue:'Кодекс детектива «Адал азамат»: достоинство человека нужно уважать не только в литературе, но и в жизни.',
  q:'Соедините ценность с поступком.',
  pairs:[['Единство и солидарность','Класс помогает однокласснику, которого травят'],
   ['Справедливость и ответственность','Староста честно сообщает о проблеме и не оставляет её без решения'],
   ['Закон и порядок','Школа соблюдает правила и защищает каждого ученика'],
   ['Адал азамат','Не смеяться над слабым, быть честным и помогать, не ожидая награды']],
  why:'Лекарство от равнодушия — сострадание и ответственность.',hint:'Какой поступок защищает достоинство другого?'},
 {t:'choice',clue:'Ситуация: в школьном чате одноклассника постоянно высмеивают. Одни смеются, другие молчат.',
  q:'Как поступит настоящий «Адал азамат»?',opts:['Промолчит: это не его дело','Поддержит одноклассника, остановит травлю и при необходимости обратится к взрослым','Тоже пошутит, чтобы не стать мишенью'],ans:1,
  why:'Это и есть «Я брат твой» сегодня: сострадание, солидарность, ответственность.',hint:'Что противоположно равнодушию?'},
 {t:'order',clue:'Следователь перепутал страницы дела. Расставьте события (перетаскивайте карточки или нажимайте ▲▼).',
  q:'Восстановите хронологию.',
  items:['Годы унижений в департаменте','Появление новой шинели','Кража шинели','Отказ значительного лица помочь','Болезнь и смерть Акакия Акакиевича'],
  why:'Трагедия началась задолго до кражи: кража стала последней каплей.',hint:'Сначала унижения, потом шинель.'},
 {t:'choice',clue:'ВНИМАНИЕ! Шинель была похищена за одну ночь. Но человеческое достоинство Башмачкина попиралось годами.',
  q:'Когда на самом деле началась его трагедия?',opts:['В ночь кражи шинели','Когда ему отказали в помощи','Задолго до кражи: с унижения и равнодушия окружающих'],ans:2,
  why:'Главное преступление — равнодушие. Шинель украли за ночь, а человечность терялась годами.',hint:'Вспомните хронологию из предыдущего задания.'}
];
const NT=STAGES.length;
/* ====== КОНЕЦ ЗАДАНИЙ ====== */

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fresh0=()=>({i:-1,earned:0,penalty:0,ok:0,hints:0,sec:0,name:'',res:{},hinted:{}});
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){return false}};
let S=(()=>{try{return JSON.parse(lsGet(KEY))}catch(e){return null}})()||fresh0();
const save=()=>lsSet(KEY,JSON.stringify(S));
const net=()=>Math.max(0,S.earned-S.penalty);
const fmt=s=>Math.floor(s/60)+' мин '+(s%60)+' с';
let tick=null,sel=[],ordArr=[],locked=false;
const GOOD=['Отлично, детектив!','Улика принята!','Логика безупречна!'],BAD=['Не сходится…','Следствие ошиблось…','Улика не подтвердилась.'];
const pick=a=>a[Math.floor(Math.random()*a.length)];

function startTimer(){clearInterval(tick);tick=setInterval(()=>{S.sec++;if(S.sec%5===0)save()},1000)}
function evidChips(){
  return '<div class="chips">'+EVID.map((e,k)=>{const on=S.res[2*k]&&S.res[2*k+1];return `<span class="chip ${on?'on':''}">${on?'✅':'🔒'} ${esc(e)}</span>`}).join('')+'</div>';
}
function head(){
  $('sc').textContent=net();
  $('stg').textContent=S.i<0?'Дело № 1842':S.i>=NT?'Дело закрыто':'Этап '+(Math.floor(S.i/2)+1)+' из 5 · задание '+(S.i%2+1)+'/2';
  $('pb').style.width=(Object.keys(S.res).length/NT*100)+'%';
}

function render(){
  head();sel=[];locked=false;const a=$('app');
  if(S.i<0){
    a.innerHTML=`<section class="screen"><span class="stamp">СЕКРЕТНО</span><h1>🕵️ Шинель. Дело о потерянной человечности</h1>
    <p class="tag">Украли шинель. Погиб человек. Но кто украл у него право на человеческое достоинство?</p>
    <p>Город погружён в холод и туман. По заснеженным улицам спешат чиновники, гремят экипажи, мерцают огни фонарей. Среди тысяч жителей столицы живёт незаметный человек — Акакий Акакиевич Башмачкин. Он не совершал подвигов, не стремился к богатству и власти: служба, переписывание бумаг, скромная комната.</p>
    <p>После долгих месяцев лишений у него появилась новая шинель — символ надежды на лучшую жизнь. Но в морозную ночь неизвестные похитили её. Вскоре Акакий Акакиевич умер. Казалось бы, дело простое: кража, болезнь, смерть.</p>
    <p><b>Но в материалах расследования обнаружились странные обстоятельства…</b> Почему сослуживцы годами унижали беззащитного чиновника? Почему человек, к которому он обратился за помощью, не проявил сочувствия? Почему окружающие заметили его страдания слишком поздно? И действительно ли трагедия началась в ту ночь, когда исчезла шинель?</p>
    <p><i>Дело вновь открыто. Теперь вы — литературные детективы.</i></p>
    <div class="folder"><b>📁 ДЕЛО № 1842 · Литературное расследование</b><br>Объект: трагическая судьба Акакия Акакиевича Башмачкина.<br>Известно: унижения на службе, кража шинели, безуспешное обращение за помощью, болезнь и смерть.<br>Главная загадка: «Кто или что погубило Башмачкина?»<br>Миссия: собрать пять доказательств и вынести нравственный вердикт.<br><b>Кодекс «Адал азамат»:</b> справедливость, ответственность, уважение к человеческому достоинству.</div>
    ${evidChips()}<p>🔎 5 этапов по 2 задания · +10 баллов за верный ответ · −1 балл за подсказку · ответ после «Проверить» исправить нельзя</p>
    <input type="text" id="nm" placeholder="Фамилия и имя (для учителя)" value="${esc(S.name)}">
    <button class="main" id="go">${Object.keys(S.res).length?'Продолжить расследование':'Открыть дело'}</button>
    ${Object.keys(S.res).length?'<button class="main alt" id="rs">Сбросить сохранение</button>':''}</section>`;
    $('go').onclick=()=>{const n=$('nm').value.trim();if(!n){$('nm').style.borderColor='#a8322d';$('nm').placeholder='Введите фамилию и имя';return}
      S.name=n;if(S.i<0)S.i=0;save();startTimer();render()};
    if($('rs'))$('rs').onclick=()=>{S=fresh0();save();render()};return;
  }
  if(S.i>=NT){finish();return}
  stage(STAGES[S.i],a);
}

function stage(st,a){
  const e=Math.floor(S.i/2);let body='';
  if(st.t==='choice'||st.t==='multi')body=st.opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('');
  else if(st.t==='match'){const R=shuffle(st.pairs.map(p=>p[1]));
    body=st.pairs.map((p,k)=>`<div class="row"><b>${esc(p[0])}</b><select data-k="${k}"><option value="">— выберите —</option>${R.map(r=>`<option>${esc(r)}</option>`).join('')}</select></div>`).join('')}
  else if(st.t==='text')body='<input type="text" id="tx" placeholder="Ваш ответ...">';
  else{ordArr=shuffle(st.items);body='<div id="ol"></div>'}
  a.innerHTML=`<section class="screen"><span class="stamp">ДОСЬЕ</span><h2>Этап ${e+1}. «${esc(EPIS[e])}»</h2>
  <small>Задание ${S.i%2+1} из 2 · доказательство: ${esc(EVID[e])}</small>${evidChips()}
  <div class="clue">📜 ${esc(st.clue)}</div><p><b>${esc(st.q)}</b></p>${body}
  <div id="fb" class="fb"></div><div id="hn" class="hint"></div>
  <div><button class="main" id="ck">Проверить</button><button class="main alt" id="hb">💡 Подсказка (−1 балл)</button>
  <button class="main" id="nx" style="display:none">Дальше →</button></div></section>`;
  if(st.t==='order')drawOrder();
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(locked)return;const k=+b.dataset.k;
    if(st.t==='choice'){sel=[k];document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'))}else sel=sel.includes(k)?sel.filter(x=>x!==k):sel.concat(k);
    b.classList.toggle('sel',sel.includes(k))});
  $('hb').onclick=()=>{if(locked)return;if(!S.hinted[S.i]){S.hinted[S.i]=1;S.hints++;S.penalty+=HINT_COST;save();head()}$('hn').textContent='💡 '+st.hint};
  $('nx').onclick=()=>{S.i++;save();render()};
  $('ck').onclick=()=>check(st);
  if(S.res[S.i]){showResult(st,S.res[S.i].ok,true)}   // уже проверено (после перезагрузки)
}

function drawOrder(){
  $('ol').innerHTML=ordArr.map((t,k)=>`<div class="ord" ${locked?'':'draggable="true"'}><span>${k+1}. ${esc(t)}</span><button data-u="${k}" ${locked?'disabled':''}>▲</button><button data-d="${k}" ${locked?'disabled':''}>▼</button></div>`).join('');
  if(locked)return;
  $('ol').querySelectorAll('.ord').forEach((el,k)=>{
    el.ondragstart=e=>e.dataTransfer.setData('text/plain',k);el.ondragover=e=>e.preventDefault();
    el.ondrop=e=>{e.preventDefault();const f=+e.dataTransfer.getData('text/plain');if(isNaN(f)||f===k)return;const[m]=ordArr.splice(f,1);ordArr.splice(k,0,m);drawOrder()}});
  $('ol').querySelectorAll('button').forEach(b=>b.onclick=()=>{const u=b.dataset.u!==undefined,k=+(u?b.dataset.u:b.dataset.d),j=u?k-1:k+1;
    if(j<0||j>=ordArr.length)return;[ordArr[k],ordArr[j]]=[ordArr[j],ordArr[k]];drawOrder()});
}

function correct(st){
  if(st.t==='choice')return st.opts[st.ans];
  if(st.t==='multi')return st.ans.map(k=>st.opts[k]).join('; ');
  if(st.t==='match')return st.pairs.map(p=>p[0]+' → '+p[1]).join('<br>');
  if(st.t==='order')return st.items.map((x,k)=>(k+1)+'. '+x).join('<br>');
  return 'см. объяснение';
}
function showResult(st,ok,again){
  locked=true;
  document.querySelectorAll('#app .opt,#app select,#app input,#app #hb,#app #ck').forEach(x=>x.disabled=true);
  if(st.t==='order'){drawOrder()}
  if(st.t==='choice'||st.t==='multi'){const A=st.t==='choice'?[st.ans]:st.ans;
    document.querySelectorAll('.opt').forEach((b,k)=>{b.classList.remove('sel');if(A.includes(k))b.classList.add('good');else if(!again&&sel.includes(k))b.classList.add('bad')})}
  const fb=$('fb');fb.className='fb '+(ok?'ok':'no');
  fb.innerHTML=(ok?'✅ <b>'+pick(GOOD)+'</b> ':'❌ <b>'+pick(BAD)+'</b> Исправить ответ нельзя. ')+(again?'Ответ уже засчитан. ':'')+
    esc(st.why)+(ok?'':'<br><b>Верный ответ:</b> '+(st.t==='match'||st.t==='order'?'<br>':'')+correct(st));
  $('nx').style.display='';
  const last=S.i%2===1;$('nx').textContent=S.i===NT-1?'К вердикту →':last?'🗂 Получить доказательство →':'Дальше →';
}
function check(st){
  if(locked||S.res[S.i])return;let ok=false;
  if(st.t==='choice')ok=sel.length===1&&sel[0]===st.ans;
  else if(st.t==='multi')ok=sel.length===st.ans.length&&st.ans.every(x=>sel.includes(x));
  else if(st.t==='text'){if(!$('tx').value.trim()){$('tx').style.borderColor='#a8322d';return}ok=st.re.test($('tx').value.trim())}
  else if(st.t==='order')ok=ordArr.every((t,k)=>t===st.items[k]);
  else{const sl=[...document.querySelectorAll('select')];
    if(sl.some(s=>!s.value)){sl.forEach(s=>{if(!s.value)s.style.borderColor='#a8322d'});return}
    ok=sl.every((s,k)=>s.value===st.pairs[k][1]);
    sl.forEach((s,k)=>{s.style.borderColor=s.value===st.pairs[k][1]?'#4d8a4a':'#a8322d'})}
  S.res[S.i]={ok};if(ok){S.ok++;S.earned+=PTS}save();head();showResult(st,ok,false);
}

/* ---------- Финал и отправка учителю ---------- */
const enc=o=>'KVEST1:'+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec=c=>JSON.parse(decodeURIComponent(escape(atob(c.replace(/^KVEST1:/,'')))));
function result(){return{n:S.name,sc:net(),e:S.earned,p:S.penalty,h:S.hints,ok:S.ok,t:NT,pct:Math.round(S.ok/NT*100),sec:S.sec,
  r:Array.from({length:NT},(_,k)=>S.res[k]&&S.res[k].ok?1:0),d:new Date().toLocaleString('ru-RU')}}
function summary(){const r=result();return `Квест «Шинель. Дело о потерянной человечности»\nУченик: ${r.n}\nИтого баллов: ${r.sc} (заработано ${r.e}, снято за подсказки ${r.p})\nВерных ответов: ${r.ok}/${r.t} (${r.pct}%)\nПодсказок: ${r.h}\nВремя: ${fmt(r.sec)}\nДата: ${r.d}\nКод для учителя:\n${enc(r)}`}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type||'text/plain;charset=utf-8'}));a.download=name;a.click()}
function finish(){
  clearInterval(tick);head();$('pb').style.width='100%';const r=result();
  const rank=r.pct>=85?'Старший следователь ⚖️':r.pct>=60?'Следователь 🔎':'Стажёр: перечитайте повесть 📖';
  $('app').innerHTML=`<section class="screen"><span class="stamp">ДЕЛО ЗАКРЫТО</span><h1>⚖️ Окончательный вердикт</h1>
  <div class="clue"><b>В ходе расследования установлено:</b> шинель была похищена за одну ночь, но человеческое достоинство Башмачкина попиралось годами. <b>Подлинное преступление — равнодушие.</b> Трагедия началась в насмешках сослуживцев, в бездушии «значительного лица» и в запоздалом сочувствии окружающих.</div>
  ${evidChips()}
  <div class="stats"><div><b>${esc(r.n)}</b>следователь</div><div><b>${r.e}</b>заработано баллов (макс. ${NT*PTS})</div><div><b>−${r.p}</b>снято за подсказки</div><div><b>${r.sc}</b>итого баллов</div><div><b>${r.ok}/${r.t}</b>верно (${r.pct}%)</div><div><b>${r.h}</b>использовано подсказок</div><div><b>${fmt(r.sec)}</b>время</div></div>
  <p>Звание: <b>${rank}</b></p>
  <div class="clue"><b>Что мы выяснили:</b> автор выражает отношение к герою через иронию, звукопись, цветопись, антитезу, градацию, символ и психологический параллелизм; мотив «я брат твой» — ядро гуманизма. Ценности «Адал азамат»: единство и солидарность, справедливость и ответственность, закон и порядок; достоинство человека нужно уважать и в литературе, и в жизни.</div>
  <h2>📨 Отправить результат учителю</h2>
  <p>Страница не может отправить данные сама. Выберите способ: письмо, файл или копирование кода. Учитель увидит результат во вкладке «Учитель».</p>
  <input type="email" id="em" placeholder="E-mail учителя" value="${esc(TEACHER_EMAIL||lsGet(EKEY)||'')}">
  <button class="main" id="mail">✉ Отправить письмом</button><button class="main alt" id="cp">📋 Копировать код</button><button class="main alt" id="fl">💾 Скачать файл</button>
  <div id="sm" class="hint"></div><button class="main alt" id="again">🔄 Начать заново</button></section>`;
  $('mail').onclick=()=>{const m=$('em').value.trim();lsSet(EKEY,m);location.href='mailto:'+encodeURIComponent(m).replace('%40','@')+'?subject='+encodeURIComponent('Результат квеста «Шинель»: '+S.name)+'&body='+encodeURIComponent(summary());$('sm').textContent='Откроется почтовая программа: нажмите «Отправить» в письме.'};
  $('cp').onclick=()=>{const t=summary();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>$('sm').textContent='Скопировано. Отправьте учителю в мессенджере или почте.').catch(()=>{prompt('Скопируйте текст:',t)})};
  $('fl').onclick=()=>{dl('результат_'+S.name.replace(/\s+/g,'_')+'.txt',summary());$('sm').textContent='Файл скачан. Отправьте его учителю.'};
  $('again').onclick=()=>{if(confirm('Начать заново? Текущий результат будет удалён с этого устройства.')){S=fresh0();save();render()}};
}

/* ---------- Вкладки: фон и учитель ---------- */
function openM(html){$('mdc').innerHTML=html+'<button class="main alt" id="cl">Закрыть</button>';$('md').classList.add('show');$('cl').onclick=()=>$('md').classList.remove('show')}
function applyBg(u){document.body.style.backgroundImage=u?`linear-gradient(#000a,#000c),url(${u})`:'';document.body.style.backgroundSize='cover';document.body.style.backgroundAttachment='fixed'}
$('bgB').onclick=()=>{
  openM('<h2>🖼 Фон игры</h2><p>Загрузите свою картинку (например, старый Петербург). Она будет затемнена для читаемости.</p><input type="file" id="bf" accept="image/*"><div class="hint" id="bm"></div><button class="main alt" id="br">Сбросить фон</button>');
  $('bf').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{
    const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const u=c.toDataURL('image/jpeg',.7);applyBg(u);$('bm').textContent=lsSet(BGKEY,u)?'Фон применён и сохранён.':'Фон применён (на этом устройстве сохранить не удалось).'};im.src=rd.result};rd.readAsDataURL(f)};
  $('br').onclick=()=>{applyBg('');try{localStorage.removeItem(BGKEY)}catch(e){}$('bm').textContent='Фон сброшен.'};
};
const tList=()=>{try{return JSON.parse(lsGet(TKEY))||[]}catch(e){return[]}};
function addCodes(text){const L=tList(),found=text.match(/KVEST1:[A-Za-z0-9+\/=]+/g)||[];let n=0;
  found.forEach(c=>{try{dec(c);if(!L.includes(c)){L.push(c);n++}}catch(e){}});lsSet(TKEY,JSON.stringify(L));return n}
function tTable(){
  const rows=tList().map(c=>{try{return dec(c)}catch(e){return null}}).filter(Boolean);
  if(!rows.length)return '<p>Пока нет результатов.</p>';
  return '<div class="tw"><table><tr><th>Ученик</th><th>Итого</th><th>Заработано</th><th>Штраф</th><th>Верно</th><th>%</th><th>Подсказок</th><th>Время</th><th>Дата</th><th>Задания 1–'+NT+'</th></tr>'+
  rows.map(r=>`<tr><td>${esc(r.n)}</td><td><b>${r.sc}</b></td><td>${r.e}</td><td>−${r.p}</td><td>${r.ok}/${r.t}</td><td>${r.pct}%</td><td>${r.h}</td><td>${fmt(r.sec)}</td><td>${esc(r.d)}</td><td>${r.r.map(x=>x?'✅':'❌').join('')}</td></tr>`).join('')+'</table></div>';
}
$('tcB').onclick=()=>{
  openM('<h2>👩‍🏫 Результаты учеников</h2><p>Вставьте присланные коды (или целые письма) либо загрузите файлы учеников.</p><textarea id="ta" rows="4" placeholder="Вставьте текст с кодом KVEST1:..."></textarea><button class="main" id="ad">Добавить</button> <input type="file" id="tf" accept=".txt" multiple><div class="hint" id="tm"></div><div id="tb">'+tTable()+'</div><button class="main alt" id="cs">Скачать CSV</button><button class="main alt" id="cr">Очистить таблицу</button>');
  const ref=n=>{$('tb').innerHTML=tTable();$('tm').textContent='Добавлено результатов: '+n};
  $('ad').onclick=()=>{ref(addCodes($('ta').value));$('ta').value=''};
  $('tf').onchange=async e=>{let n=0;for(const f of e.target.files)n+=addCodes(await f.text());ref(n)};
  $('cr').onclick=()=>{if(confirm('Очистить все результаты?')){lsSet(TKEY,'[]');ref(0)}};
  $('cs').onclick=()=>{const rows=tList().map(c=>{try{return dec(c)}catch(e){return null}}).filter(Boolean);
    dl('результаты_квеста.csv','\ufeffУченик;Итого;Заработано;Штраф;Верно;Процент;Подсказок;Время(с);Дата;Задания\n'+rows.map(r=>[r.n,r.sc,r.e,r.p,r.ok+'/'+r.t,r.pct,r.h,r.sec,r.d,r.r.join('')].join(';')).join('\n'),'text/csv;charset=utf-8')};
};

{const b=lsGet(BGKEY);if(b)applyBg(b)}
if(S.i>=0&&S.i<NT)startTimer();
render();
</script>
</body>
</html>
